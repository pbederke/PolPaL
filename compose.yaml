services:

  frontend:
    container_name: polpal-web
    image: polpal-web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - COOKIE_SECURE=true
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/polpal?schema=public
      - KEY_ENCRYPTION=changeme
      - TRUSTED_PROXY_IP_HEADER=x-forwarded-for
      - RATE_LIMIT_IP_SALT=changeme
    depends_on:
      - db

  db:
    image: postgres:17
    restart: always
    container_name: polpal-postgres-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polpal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./PolPaL_PostgreSQL_anon.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro

volumes:
  postgres_data:
